name: GLaDOS Check-in

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
  schedule:
    - cron: '18 9,12 * * *'
      timezone: 'Asia/Shanghai'

# 定时与手动触发可能重叠：同一时间只保留一个运行，避免重复签到与重复推送
concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  build:
    name: glados/railgun checkin
    runs-on: ubuntu-latest

    # 脚本自带 5 分钟运行预算；这里再兜底，避免异常情况卡住
    timeout-minutes: 15

    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: [3.13]

    # 这里加入全局环境变量，强制后续所有第三方 actions 兼容 Node.js 24 运行环境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # 安装 python 库
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 启动 hysteria2 代理：签到请求改走 HY2 节点出口，否则 GLaDOS 服务端
      # Cloudflare 验证会把 GitHub 机房 IP 当机器人拒掉（code=5）
      - name: Start hysteria2 proxy
        env:
          HY2_PROXY_URL: ${{ secrets.HY2_PROXY_URL }}
        run: |
          if [ -z "$HY2_PROXY_URL" ]; then
            echo "HY2_PROXY_URL 未设置，直连模式"
            exit 0
          fi
          python3 - <<'PY'
          import os, sys
          from urllib.parse import urlparse, parse_qs, unquote
          url = os.environ["HY2_PROXY_URL"].strip()
          u = urlparse(url)
          if u.scheme != "hysteria2" or not u.hostname or not u.port:
              print("HY2_PROXY_URL 格式不对")
              sys.exit(1)
          q = parse_qs(u.query)
          sni = q.get("sni", [u.hostname])[0]
          insecure = q.get("insecure", ["0"])[0] in ("1", "true")
          alpn = q.get("alpn", ["h3"])[0].split(",")
          pin = q.get("pinSHA256", [None])[0]
          auth = unquote(u.password or u.username or "")
          cfg = []
          cfg.append(f"server: {u.hostname}:{u.port}")
          cfg.append(f'auth: "{auth}"')
          cfg.append("tls:")
          cfg.append(f"  sni: {sni}")
          cfg.append(f"  insecure: {'true' if insecure else 'false'}")
          cfg.append("  alpn: [" + ", ".join(alpn) + "]")
          if pin:
              cfg.append(f"  pinSHA256: {pin}")
          obfs = q.get("obfs", [None])[0]
          if obfs:
              cfg.append("obfs:")
              cfg.append(f"  type: {obfs}")
              obfs_pw = q.get("obfs-password", [None])[0]
              if obfs_pw:
                  cfg.append(f"  password: {obfs_pw}")
          cfg.append("socks5:")
          cfg.append("  listen: 127.0.0.1:10808")
          cfg.append("http:")
          cfg.append("  listen: 127.0.0.1:10809")
          open("hy2.yaml", "w").write("\n".join(cfg) + "\n")
          print("hy2.yaml 已生成")
          PY
          wget -q "https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64" -O hysteria
          chmod +x hysteria
          ./hysteria client -c hy2.yaml > hysteria.log 2>&1 &
          echo $! > hysteria.pid
          for i in $(seq 1 20); do
            if curl -s --max-time 3 -x http://127.0.0.1:10809 https://ifconfig.me >/dev/null 2>&1; then
              echo "代理已就绪，出口 IP：$(curl -s --max-time 5 -x http://127.0.0.1:10809 https://ifconfig.me)"
              echo "HTTPS_PROXY=http://127.0.0.1:10809" >> "$GITHUB_ENV"
              echo "HTTP_PROXY=http://127.0.0.1:10809" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "代理启动失败，hysteria.log："
          cat hysteria.log || true
          exit 1

      # 执行 签到脚本
      - name: Running checkin
        run: |
          python checkin.py
        env:
          PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_API_URL: ${{ secrets.TG_API_URL }}
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
          GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}

      # 签到失败（配置错误会 exit 1）时也要保活，否则恰好错过最需要提醒的那次
      - name: Keep alive
        if: ${{ !cancelled() }}
        uses: liskin/gh-workflow-keepalive@v1

      - name: Delete workflow runs
        if: ${{ !cancelled() }}
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 7
          delete_run_by_conclusion_pattern: success
